name: Compilar APK de Volume Dock
on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Compilar instalador debug firmado
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDock-OnePlus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK con enlace directo
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/VolumeDock-OnePlus-v1.3.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/VolumeDock-OnePlus-v1.3.apk
          if git diff --cached --quiet; then
            echo "APK sin cambios"
          else
            git commit -m "Publish Volume Dock 1.3 APK [skip ci]"
            git push origin HEAD:main
          fi
